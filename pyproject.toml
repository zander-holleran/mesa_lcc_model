[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-lcc-model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mesa>=3.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.0",
    "scipy>=1.11",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "tqdm>=4.0",
    "requests>=2.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["season*", "traffic*", "collect_external_data*"]
